<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' 'unsafe-inline';
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src https://fonts.gstatic.com;
  img-src 'self' data: https://*.goatcounter.com;
  connect-src 'self' https://*.goatcounter.com;
  base-uri 'none';
  form-action 'none'">
<title>少年股神 · 股市人生模擬器</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="少年股神">
<meta property="og:title" content="少年股神 · 股市人生模擬器">
<meta property="og:description" content="16 歲用壓歲錢開戶，40 歲結算：賺了多少，也看你過得好不好。相同種子＋相同選擇＝相同人生。">
<meta property="og:url" content="https://ishoplus.github.io/gootsai/">
<meta property="og:image" content="https://ishoplus.github.io/gootsai/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="description" content="16 歲用壓歲錢開始投資。每年把點數分配到你在意的事，到 40 歲看你賺了多少，也看你過得好不好。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 fill=%22%23e8e4da%22/%3E%3Cpath d=%22M3 24 L10 16 L15 20 L22 8 L29 12%22 stroke=%22%238c2f2f%22 stroke-width=%222.5%22 fill=%22none%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
/* ================================================================
   重蓋的版面：單欄訊息流。
   前一版是「顯示面板＋輸入面板」分食一個固定高度的螢幕，
   手機上兩格互相遮蔽的 bug 修一個冒一個——結構問題修不完。
   這一版整頁只有一條自然捲動的訊息流，決定就長在流的最尾端：
   沒有 dock、沒有覆蓋層、沒有狀態機，遮蔽在結構上不可能發生。
   ================================================================ */
:root{
  --bg:#ddd8cb; --card:#faf8f2; --card2:#f0ece2; --edge:#d8d1c1;
  --ink:#1d1a15; --dim:#736a5c; --accent:#8c2f2f; --accent2:#b04545;
  --up:#1d6b3a; --dn:#a51e1e; --warn:#8a5a0c; --gold:#7d5f18;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sans:'Noto Sans TC',system-ui,-apple-system,sans-serif;
  --serif:'Noto Serif TC',Georgia,serif;
  --r:14px;
}
body[data-theme="green"]{--bg:#07150f;--card:#10251b;--card2:#0b1d15;--edge:#284638;
  --ink:#eee8d8;--dim:#9baa9f;--accent:#d5aa58;--accent2:#e4bd70;--up:#79c98d;--dn:#ef7777}
body[data-theme="blue"]{--bg:#101722;--card:#182333;--card2:#121d2b;--edge:#30435b;
  --ink:#eef4fa;--dim:#91a5ba;--accent:#55b9e8;--accent2:#76c8ed;--up:#70d0a0;--dn:#ff7f86}
body[data-theme="mono"]{--bg:#dedede;--card:#fff;--card2:#f3f3f3;--edge:#bdbdbd;
  --ink:#111;--dim:#666;--accent:#222;--accent2:#444;--up:#12612e;--dn:#981919}
body.big-text{font-size:17px}
body.big-text button{font-size:16px}
*{box-sizing:border-box}
html{margin:0;padding:0}
body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%}
b.up{color:var(--up)} b.dn{color:var(--dn)} b.hl{color:var(--accent)} b.gd{color:var(--gold)}
.num{display:inline-block;padding:0 4px;border-radius:5px;background:rgba(140,47,47,.1);
  color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.num.up{background:rgba(29,107,58,.11);color:var(--up)}
.num.dn{background:rgba(165,30,30,.11);color:var(--dn)}

/* ---- 版心：一欄到底，桌機也是同一欄置中 ---- */
#start,#game{width:100%;max-width:560px;margin:0 auto;background:var(--card2);
  box-shadow:0 0 0 1px var(--edge);min-height:100vh;min-height:100svh}
/* flex 直欄＋#feed flex:1（借 YaKyoLife 的 #app/#mid）：
   內容短的年份，訊息流會撐開把輸入面板推到螢幕底邊——
   不然 sticky 面板會浮在內容正下方、畫面中間，收合起來像沒收乾淨。 */
#game{display:flex;flex-direction:column}
#feed{flex:1 1 auto}

/* ---- 開場 ---- */
#start{display:block;padding:40px 20px calc(40px + env(safe-area-inset-bottom))}
h1{font-family:var(--serif);font-size:40px;line-height:1.08;margin:0 0 6px;font-weight:900}
h1 em{display:block;font-family:var(--sans);font-style:normal;font-size:13px;letter-spacing:.34em;
  text-indent:.34em;color:var(--accent);margin:14px auto 0;font-weight:700;max-width:300px;
  padding-top:10px;border-top:1px solid var(--edge)}
#start h1{text-align:center;margin-top:12px;font-size:43px;letter-spacing:.04em}
.tape{height:2px;border-radius:2px;background:linear-gradient(90deg,var(--up),var(--dn),var(--up));
  opacity:.55;margin:18px auto;max-width:300px}
.sub{color:var(--dim);font-size:13.5px;line-height:1.85;margin:0 0 22px}
#start>.sub{text-align:center;line-height:1.75;letter-spacing:.02em;margin-bottom:24px}
.field{margin-bottom:16px}
.field>label{display:block;font-size:11px;font-weight:700;color:var(--dim);margin-bottom:7px}
input{width:100%;padding:12px 13px;background:var(--card);color:var(--ink);border-radius:10px;
  border:1px solid var(--edge);font-size:15px;font-family:var(--mono);outline:none}
input:focus{border-color:var(--accent)}
#plans{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
#plans button{padding:10px 4px;text-align:center;white-space:nowrap;margin:0}
#plan-desc{min-height:22px;margin:7px 2px 0;color:var(--dim);font-size:11.5px;line-height:1.55}
#go{margin-top:22px;min-height:48px;text-align:center;font-weight:700}
.seedline{margin-top:22px;padding-top:18px;border-top:1px solid var(--edge);
  font-family:var(--mono);font-size:11px;line-height:1.8;color:var(--dim)}
.seedline #seed{display:inline-block;width:130px;margin-left:6px;padding:5px 7px;
  text-align:center;font-size:11px}
#display-settings{margin-top:18px;color:var(--dim);font:12px/1.6 var(--mono)}
#display-settings>summary{cursor:pointer;list-style:none;padding:3px 0}
#display-settings>summary::-webkit-details-marker{display:none}
#display-settings>summary::before{content:'▸';display:inline-block;margin-right:7px;font-size:10px}
#display-settings[open]>summary::before{transform:rotate(90deg)}
#display-settings .cfg{margin-top:12px}
#display-settings .cfg label{display:block;margin-bottom:6px;font-size:10px;letter-spacing:.15em}
#display-settings .cfg-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
#display-settings button{min-height:38px;padding:7px 8px;margin:0;text-align:center;font-size:12px}
#display-settings button.on{color:var(--accent);border-color:var(--accent);font-weight:700}
.byline{text-align:center;margin-top:24px;color:var(--dim);font-size:12px}
.byline a{color:var(--accent);text-decoration:none}
#ver-badge{text-align:center;margin-top:6px;font:10px/1.4 var(--mono);
  letter-spacing:.14em;color:var(--dim);opacity:.55}

/* ---- HUD：唯一固定的東西，一條瘦的 ---- */
#hud{position:sticky;top:0;z-index:30;background:var(--card);
  border-bottom:1px solid var(--edge);
  padding:calc(7px + env(safe-area-inset-top)) 14px 7px}
#hud .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
#hud .yr{font-family:var(--serif);font-size:19px;font-weight:900;line-height:1.2}
#hud .yr small{font-family:var(--mono);font-size:9.5px;font-weight:400;
  letter-spacing:.14em;color:var(--dim);margin-left:7px}
#hud .nav{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--accent);
  letter-spacing:-.02em}
#hud .nav small{font-size:9px;letter-spacing:.18em;color:var(--dim);font-weight:400;margin-right:6px}
#hud .chips{display:flex;gap:6px;margin-top:6px}
#hud .chip{flex:1 1 0;min-width:0;background:var(--card2);border:none;border-radius:8px;
  padding:3px 8px 4px;font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--ink);
  line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;
  min-height:0;margin:0}
#hud .chip span{display:block;font-size:8.5px;letter-spacing:.14em;color:var(--dim);font-weight:400}
#hud .chip.warn{color:var(--dn)}
/* width:auto 蓋掉全域 button{width:100%}——不蓋的話這顆 chip 會把
   整行撐到 442px，layout viewport 跟著變寬，整頁（連固定浮層）都被推歪 */
#hud .chip.btn{cursor:pointer;border:1px solid var(--edge);color:var(--accent);text-align:center;
  flex:0 0 auto;width:auto;min-height:0;margin:0;padding:3px 12px 4px}
/* 相位燈（借 YaKyoLife 的季初/賽季中/季末）：一眼知道年循環走到哪一步 */
#lamps{display:flex;gap:12px;margin-top:6px}
.lamp{display:flex;align-items:center;gap:4px;font:10px/1.2 var(--mono);
  letter-spacing:.12em;color:var(--dim);opacity:.45}
.lamp i{width:6px;height:6px;border-radius:50%;background:var(--edge);font-style:normal}
.lamp.on{opacity:1;color:var(--accent);font-weight:700}
.lamp.on i{background:var(--accent);box-shadow:0 0 0 3px rgba(140,47,47,.15)}

/* ---- 輸入面板：sticky 底部、可收合、內部自己捲 ---- */
#dock{position:sticky;bottom:0;z-index:20;background:var(--card);
  border-top:2px solid var(--edge);border-radius:14px 14px 0 0;
  box-shadow:0 -8px 24px rgba(20,17,12,.14)}
#dock-head{display:flex;align-items:center;gap:10px;width:100%;margin:0;padding:9px 14px 7px;
  min-height:0;background:none;border:none;border-radius:14px 14px 0 0;cursor:pointer;text-align:left}
#dock-head span#dock-t{flex:1;font-size:13px;font-weight:700;line-height:1.4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dock-head span#dock-c{font-family:var(--mono);font-size:11px;color:var(--dim);flex:none}
#dock-body{max-height:52vh;max-height:52svh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:2px 12px calc(12px + env(safe-area-inset-bottom))}
/* 配點展開＝全部攤開，不內捲。內容壓緊到一般手機（667px 高）整面裝得下；
   面板以內容定高，必要時蓋到 HUD 上（z-index 提高）。
   max-height 只是 480px 級古董機的最後保險，正常尺寸碰不到。 */
#dock.alloc{z-index:40}
#dock.alloc #dock-body{max-height:calc(100vh - 8px);max-height:calc(100svh - 8px)}
#dock.collapsed #dock-body{display:none}
#dock:empty,#dock.idle{display:none}
.dockq{font-size:13.5px;line-height:1.6;color:var(--dim);margin:2px 2px 8px}

/* ---- 訊息流 ---- */
#feed{padding:12px 12px 16px}
.yr-sec{margin-bottom:4px}
.yr-head{text-align:center;color:var(--dim);font:11px/1.5 var(--mono);letter-spacing:.22em;
  padding:10px 0 8px;cursor:pointer;user-select:none}
.yr-head::before,.yr-head::after{content:'——';letter-spacing:0;margin:0 7px}
.yr-head::after{content:'——  ▾'}
.yr-sec.collapsed .yr-head::after{content:'——  ▸'}
.yr-sec.collapsed .yr-body{display:none}
.yr-body{display:flex;flex-direction:column;gap:9px}
.card{background:var(--card);border:1px solid var(--edge);border-radius:var(--r);
  padding:12px 14px}
.card h4{display:flex;align-items:center;gap:7px;margin:0 0 6px;color:var(--dim);
  font:700 11px/1.5 var(--mono);letter-spacing:.16em}
.card h4::before{content:'■';font-size:8px;color:currentColor}
.card p{margin:0;font-size:13.5px;line-height:1.75}
.card.good h4{color:var(--up)} .card.bad h4{color:var(--dn)}
.card.info h4{color:var(--accent)} .card.gold h4{color:var(--gold)}
.card .s{font-size:11.5px;color:var(--dim);font-family:var(--mono)}
.sigline{display:flex;gap:7px;align-items:flex-start;font-size:13.5px;line-height:1.6}
.sigline i{font-style:normal;color:var(--accent);font-family:var(--mono);font-size:11px;padding-top:3px}
.sigline.theme{color:var(--accent);font-weight:700}

/* ---- 決定卡：選項就長在流的尾端 ---- */
.card.ask{border-color:var(--accent);box-shadow:0 2px 14px rgba(20,17,12,.07)}
.card.ask h4{color:var(--accent)}
button{font-family:var(--sans);font-size:14.5px;cursor:pointer;text-align:left;border-radius:10px;
  background:var(--card2);color:var(--ink);border:1px solid var(--edge);padding:10px 12px;width:100%;
  min-height:44px;line-height:1.4;margin:0 0 7px;transition:none}
button:last-child{margin-bottom:0}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
button .s{display:block;font-size:11px;line-height:1.45;color:var(--dim);font-family:var(--mono);
  margin-top:2px}
button .s b{color:var(--ink);font-weight:700}
button.main{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
button.main .s{color:rgba(255,255,255,.82)}
button.main .s b{color:#fff}
button.main:hover:not(:disabled){background:var(--accent2);border-color:var(--accent2)}
button.warn{border-color:var(--dn);color:var(--dn)}
button.warn .s b{color:var(--dn)}
.ask .opts{margin-top:9px}
.picked{margin-top:9px;padding:8px 11px;border-left:3px solid var(--accent);
  background:var(--card2);border-radius:0 8px 8px 0;font-size:13.5px;font-weight:700}

/* ---- 配點卡 ---- */
/* 配點內容要在 667px 高的手機一次全攤開，所以每一段都壓到最省 */
.dice{display:flex;gap:6px;margin:6px 0 8px;padding:5px 7px;background:var(--card2);
  border:1px solid var(--edge);border-radius:11px}
.dz{flex:1 1 0;min-width:0;text-align:center}
.dz i{display:grid;place-items:center;width:100%;max-width:32px;aspect-ratio:1;margin:auto;
  border-radius:50%;background:var(--card);border:2px solid var(--edge);color:var(--ink);
  font:700 14px/1 var(--mono);font-style:normal;box-shadow:inset 0 -2px 0 rgba(0,0,0,.1)}
.dz em{display:block;font-style:normal;font-size:8px;line-height:1.3;color:var(--dim);
  margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dz.used i{background:var(--edge);opacity:.45}
.dz.done i{border-color:var(--gold);color:var(--gold)}
.dz.done em{color:var(--gold);font-weight:700}
.dz.now i{border-color:var(--accent);box-shadow:0 0 0 2px rgba(140,47,47,.16),inset 0 -3px 0 rgba(0,0,0,.1)}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px;align-items:center;
  width:100%;min-height:0;margin:0 0 5px;padding:6px 10px;border-radius:10px}
.arow .an{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  line-height:1.35}
.arow .ad{grid-column:1;font-size:10px;color:var(--dim);line-height:1.35}
.arow .put{grid-column:2;grid-row:1/3;font-family:var(--mono);font-weight:700;color:var(--accent);
  text-align:right;font-size:13.5px;line-height:1.25}
.arow .put small{display:block;font-size:8.5px;font-weight:500;color:var(--dim)}
.arow .put small.up{color:var(--up)}
.arow .bar{grid-column:1/3;position:relative;height:4px;background:var(--card2);
  border-radius:5px;overflow:visible;margin-top:3px}
.arow .bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.arow .bar em{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--gold)}
.arow:disabled{opacity:.45}
.aacts{display:grid;grid-template-columns:1fr 2fr;gap:7px;margin-top:3px}
.aacts button{margin:0;text-align:center;min-height:40px}
/* 矮螢幕再擠一級：說明行讓位給「全部攤開」 */
@media(max-height:620px){
  .arow .ad{display:none}
  .dockq{display:none}
}

/* ---- 盤面面板（唯讀，蓋不住任何決定） ---- */
#peek{position:fixed;inset:0;z-index:60;background:rgba(20,17,12,.5);
  display:none;justify-content:center;align-items:flex-end}
#peek.show{display:flex}
#peek .in{width:100%;max-width:560px;max-height:82vh;max-height:82svh;display:flex;
  flex-direction:column;background:var(--card);border-radius:16px 16px 0 0;
  box-shadow:0 -8px 30px rgba(20,17,12,.3)}
#peek .head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px 8px;border-bottom:1px solid var(--edge)}
#peek .head span{font:700 11px/1.4 var(--mono);letter-spacing:.22em;color:var(--dim)}
#peek .head button{width:auto;margin:0;padding:6px 13px;min-height:0;font-size:12.5px}
#peek .body{flex:0 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
#peek h5{margin:14px 0 7px;font:700 10px/1.5 var(--mono);letter-spacing:.2em;color:var(--dim)}
#peek h5:first-child{margin-top:0}
table.book{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px}
table.book th{text-align:right;color:var(--dim);font-weight:400;font-size:9.5px;letter-spacing:.14em;
  padding:0 0 5px;border-bottom:1px solid var(--edge)}
table.book th:first-child{text-align:left}
table.book td{padding:7px 0;border-bottom:1px solid var(--edge);text-align:right}
table.book td:first-child{text-align:left;font-family:var(--sans);font-size:13.5px}
table.book tr:last-child td{border-bottom:none}
.empty{color:var(--dim);font-size:13px;padding:8px 0}
svg.chart{width:100%;height:130px;display:block}
.legend{font-family:var(--mono);font-size:10.5px;color:var(--dim);display:flex;gap:14px;margin-top:6px}
.legend i{font-style:normal;display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:4px}

/* ---- 結局 ---- */
.card.end{border-color:var(--accent)}
.endt{font-family:var(--serif);font-size:25px;font-weight:900;line-height:1.15;
  margin:-2px 0 8px;color:var(--accent)}
.endnav{display:flex;align-items:baseline;justify-content:space-between;
  border-bottom:1px solid var(--edge);padding-bottom:7px;margin-bottom:9px}
.endnav span{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--dim)}
.endnav b{font-family:var(--mono);font-size:25px;font-weight:700;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px 10px}
.tl span{display:block;font-family:var(--mono);font-size:9px;line-height:1.35;letter-spacing:.12em;
  color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl b{font-family:var(--mono);font-size:14px;font-weight:700;line-height:1.3}
</style>
</head>
<body>

<div id="start">
  <h1>少年股神<em>股市人生模擬器</em></h1>
  <div class="tape"></div>
  <p class="sub">十六歲開戶 → 學會投資 → 經歷牛熊市場 → 四十歲結算。<br>每一顆骰子都算數。</p>
  <div class="field">
    <label>投資風格</label>
    <div id="plans"></div>
    <div id="plan-desc"></div>
  </div>
  <button class="main" id="go">開始投資人生 ▸ 十六歲開戶</button>
  <details id="display-settings">
    <summary>顯示設定</summary>
    <div class="cfg"><label>佈景主題</label><div class="cfg-grid" id="cfg-theme">

<script src="kernel.js?v=44"></script>
<script>
'use strict';
/* 這一層是純呈現。鐵律沿用：呈現層一律禁止呼叫內核的亂數——
   多消耗一次，後面整條人生就會錯位。這裡只讀狀態、只照原本的順序呼叫內核。 */
const $=id=>document.getElementById(id);
const SAFE=/[^\w㐀-䶿一-鿿぀-ヿ-]/g;
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function facts(s){
  return esc(s).replace(/([+−-]?\d+(?:\.\d+)?(?:\s?(?:%|萬|億|元|點))?)/g,function(n){
    const c=/^[+−-]/.test(n) ? (/^[+−]/.test(n)?(/^[+]/.test(n)?' up':' dn'):'') : '';
    return '<b class="num'+c+'">'+n+'</b>';
  });
}
/* ---- 埋點（GoatCounter）----
   GC_CODE 留空＝整段完全不動作，不發出任何請求。
   註冊 goatcounter.com 站台代碼後填入即可收數據：
   start-<風格>、end-<結局>、share 三個事件，加上瀏覽數。 */
const GC_CODE='';
function track(ev){
  if(!GC_CODE || location.protocol==='file:') return;
  try{
    const i=document.createElement('img');
    i.src='https://'+GC_CODE+'.goatcounter.com/count?p='+encodeURIComponent('/'+(ev||''))+
          '&t='+encodeURIComponent(ev||'view');
    i.style.display='none';
    if(document.body&&document.body.appendChild) document.body.appendChild(i);
  }catch(e){}
}
track('');

function money(v){
  const a=Math.abs(v);
  if(a>=10000) return (v/10000).toFixed(2)+'億';
  if(a>=1000)  return Math.round(v)+'萬';
  return v.toFixed(1)+'萬';
}
function sgn(v,d){ d=d==null?1:d; return (v>=0?'+':'')+v.toFixed(d); }

/* 顯示設定不參與種子與遊戲運算，只改頁面外觀。 */
const DISPLAY_KEY='stocklife-display';
let displayPref={theme:'paper',font:'normal'};
try{ displayPref=Object.assign(displayPref,JSON.parse(localStorage.getItem(DISPLAY_KEY)||'{}')); }catch(e){}
function applyDisplay(){
  document.body.dataset.theme=displayPref.theme;
  document.body.classList.toggle('big-text',displayPref.font==='big');
  ['theme','font'].forEach(k=>{
    document.querySelectorAll('#cfg-'+k+' button').forEach(b=>b.classList.toggle('on',b.dataset.v===displayPref[k]));
  });
  try{localStorage.setItem(DISPLAY_KEY,JSON.stringify(displayPref));}catch(e){}
}
['theme','font'].forEach(k=>{
  document.querySelectorAll('#cfg-'+k+' button').forEach(b=>b.onclick=()=>{displayPref[k]=b.dataset.v;applyDisplay();});
});
applyDisplay();

/* kernel.js 是外部檔案，而 CSP 的 script-src 'self' 在 file:// 底下比對不到來源，
   直接雙擊打開會載不到內核。與其停在白畫面，不如講清楚怎麼跑。 */
const NEED_VERSION=44;
if(typeof KERNEL!=='undefined' && !(KERNEL.VERSION>=NEED_VERSION)){
  document.getElementById('start').innerHTML=
    '<h1>內核是舊的<em>STALE KERNEL '+(KERNEL.VERSION||0)+' &lt; '+NEED_VERSION+'</em></h1>'+
    '<div class="tape"></div>'+
    '<p class="sub">你的瀏覽器還留著十分鐘前那份 <code>kernel.js</code>。'+
    '這一頁需要新的。強制重新整理一次就好——'+
    'Mac 是 <b class="hl">Cmd+Shift+R</b>，Windows 是 <b class="hl">Ctrl+F5</b>。</p>'+
    '<button class="main" onclick="location.reload(true)">重新載入</button>';
  throw new Error('stale kernel');
}
if(typeof KERNEL==='undefined'){
  document.getElementById('start').innerHTML=
    '<h1>載不到內核<em>KERNEL.JS NOT LOADED</em></h1><div class="tape"></div>'+
    '<p class="sub">這一頁的邏輯放在外部檔案 <code>kernel.js</code>，'+
    'CSP 在 <code>file://</code> 底下擋掉了它。開一個本機伺服器就好：</p>'+
    '<div class="field"><label>終端機</label>'+
    '<input readonly value="python3 -m http.server 8000" onclick="this.select()"></div>'+
    '<p class="sub">然後開 <b class="hl">http://localhost:8000/</b>。'+
    '部署到 GitHub Pages 之類的靜態主機則不受影響。</p>';
  throw new Error('KERNEL not loaded');
}

/* 版本徽章：讀內核的 VERSION，不另外維護一個會忘記改的數字 */
(function(){
  const vb=$('ver-badge');
  if(vb) vb.textContent='v'+(KERNEL.SEMVER||KERNEL.VERSION);
})();

/* ================= 開場 ================= */
let plan='craft';
function renderPlans(){
  const box=$('plans');
  if(!box || typeof box.querySelectorAll!=='function') return;
  const shortName={craft:'研究派',safe:'穩健派',life:'生活派'};
  box.innerHTML=(KERNEL.PLAN_K||[]).map(k=>
    '<button data-k="'+esc(k)+'"'+(k===plan?' class="main"':'')+'>'+esc(shortName[k]||KERNEL.PLANS[k].n)+'</button>').join('');
  const desc=$('plan-desc'); if(desc)desc.textContent=KERNEL.PLANS[plan].d;
  box.querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{ if(b.dataset && b.dataset.k) plan=b.dataset.k; renderPlans(); };
  });
}
renderPlans();

let g=null, benchHist=[], navHist=[];
$('go').onclick=()=>{
  const raw=($('seed').value||'').replace(SAFE,'').slice(0,24);
  const seed=raw||Math.random().toString(36).slice(2,10);
  try{ history.replaceState(null,'','?seed='+encodeURIComponent(seed)); }catch(e){}
  g=KERNEL.newGame(seed);
  g.setPlan(plan);
  $('start').style.display='none';
  $('game').style.display='';
  track('start-'+plan);
  benchHist=[]; navHist=[];
  const f=$('feed'); if(f)f.innerHTML='';
  nextYear();
};
(function(){
  const q=new URLSearchParams(location.search).get('seed');
  if(q) $('seed').value=q.replace(SAFE,'').slice(0,24);
})();

/* ================= 訊息流的積木 =================
   append-only：卡片只往尾端加，加完把畫面捲到底。
   「現在要決定什麼」永遠是流的最後一張卡——它不可能被蓋住，
   因為沒有任何東西在它下面。 */
let yearSec=null;
function scrollEnd(){
  try{ if(window.scrollTo) window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}); }catch(e){}
}
function startYearSec(year){
  const feed=$('feed'); if(!feed)return;
  /* 前一年自動收合：流不會越長越難捲，點年份那行可以再展開 */
  if(yearSec&&yearSec.classList) yearSec.classList.add('collapsed');
  const sec=document.createElement('section');
  sec.className='yr-sec';
  sec.innerHTML='<div class="yr-head">'+(2026+year)+' 年 · '+(16+year)+' 歲 · 第 '+(year+1)+' 年</div>'+
    '<div class="yr-body"></div>';
  const head=sec.querySelector('.yr-head');
  if(head) head.onclick=()=>sec.classList.toggle('collapsed');
  feed.appendChild(sec);
  yearSec=sec;
}
function card(cls,title,body){
  const host=(yearSec&&yearSec.querySelector)?yearSec.querySelector('.yr-body'):$('feed');
  if(!host)return null;
  const d=document.createElement('div');
  d.className='card'+(cls?' '+cls:'');
  d.innerHTML=(title?'<h4>'+title+'</h4>':'')+(body?'<p>'+body+'</p>':'');
  host.appendChild(d);
  scrollEnd();
  return d;
}
/* ---- 輸入面板（借 YaKyoLife 的 #act-side + choose()）----
   決定一律進底部面板，發生過的事一律進訊息流。兩邊分開，
   面板出新問題時自動展開（它的 choose() 也這樣做）。 */
function dockOpen(title,mode){
  const dk=$('dock'), body=$('dock-body'), t=$('dock-t');
  if(!dk||!body) return null;
  if(dk.classList){ dk.classList.remove('collapsed'); dk.classList.remove('idle');
    dk.classList.toggle('alloc',mode==='alloc'); }
  if(t) t.textContent=title||'　';
  const c=$('dock-c'); if(c) c.textContent='收合 ⌄';
  body.innerHTML='';
  body.scrollTop=0;
  return body;
}
function dockClear(){
  const dk=$('dock'), body=$('dock-body'), t=$('dock-t');
  if(body) body.innerHTML='';
  if(t) t.textContent='　';
  if(dk&&dk.classList){ dk.classList.remove('alloc'); dk.classList.add('idle'); }
}
(function(){
  const h=$('dock-head');
  if(!h) return;
  h.onclick=()=>{
    const dk=$('dock'); if(!dk||!dk.classList) return;
    dk.classList.toggle('collapsed');
    const c=$('dock-c'); if(c) c.textContent=dk.classList.contains('collapsed')?'展開 ⌃':'收合 ⌄';
  };
})();
/* 決定：問題的脈絡進訊息流（永遠捲得到），選項進面板 */
function ask(title,body,opts){
  if(body||title) card('ask',title,body);
  const box=dockOpen(title,null);
  if(!box){ if(opts[0])opts[0].f(); return; }
  box.innerHTML=opts.map(o=>'<button class="'+(o.main?'main':o.warn?'warn':'')+'">'+esc(o.t)+
    (o.s?'<span class="s">'+o.s+'</span>':'')+'</button>').join('');
  box.querySelectorAll('button').forEach((b,i)=>{
    b.onclick=()=>{ if(!opts[i])return; dockClear(); opts[i].f(); };
  });
  scrollEnd();
}

/* ---- 階段閘門（借 YaKyoLife 的 choose('▸ 下一階段') 模式）----
   每個階段之間放一顆寫著「接下來是什麼」的確認鈕，
   結果在你按下去之前不揭曉。放在輸入面板裡，按掉就換下一題。 */
function gate(label,f){
  const box=dockOpen('　',null);
  if(!box){ f(); return; }
  const b=document.createElement('button');
  b.className='main gate';
  b.textContent='▸ '+label;
  b.onclick=()=>{ dockClear(); f(); };
  box.appendChild(b);
  scrollEnd();
}
function setLamp(i){
  for(let k=0;k<3;k++){
    const el=$('lp'+k);
    if(el&&el.classList) el.classList.toggle('on',k===i);
  }
}

/* ================= HUD ================= */
function paint(){
  if(!g)return;
  const r=g.raw;
  $('h-yr').textContent=r.age+' 歲';
  $('h-year').textContent='第 '+(r.year+1)+' 年 · '+(2026+r.year);
  $('h-nav').textContent=money(g.nav());
  const cc=$('c-cash'); if(cc)cc.innerHTML='<span>手上現金</span>'+money(r.cash);
  const ct=$('c-tilt');
  if(ct){ ct.innerHTML='<span>操作衝動</span>'+Math.round(r.tilt)+(r.tilt>=80?' 追高':r.tilt<=20?' 不敢':'');
    ct.className='chip'+(r.tilt>=80||r.tilt<=20?' warn':''); }
  const cl=$('c-life');
  if(cl){ cl.innerHTML='<span>生活狀態</span>'+Math.round(r.life)+(r.life<=30?' 撐不住':'');
    cl.className='chip'+(r.life<=30?' warn':''); }
}

/* ================= 盤面（唯讀浮層） ================= */
function renderPeek(){
  const r=g.raw, host=$('pk-book');
  if(host){
    const ids=Object.keys(r.book||{});
    if(!ids.length && r.debt<=0){
      host.innerHTML='<div class="empty">目前沒有手動持股。自動配置的部位在年末結算卡裡。</div>';
    }else{
      let h='<table class="book"><tr><th>標的</th><th>市值</th><th>成本</th><th>未實現</th></tr>';
      ids.forEach(id=>{
        const b=r.book[id], p=r.price[id], mv=b.sh*p, pl=(p/b.cost-1)*100;
        h+='<tr><td>'+esc(KERNEL.BY_ID[id].n)+'</td><td>'+money(mv)+'</td><td>'+b.cost.toFixed(1)+'</td>'+
           '<td><b class="'+(pl>=0?'up':'dn')+'">'+sgn(pl)+'%</b></td></tr>';
      });
      if(r.debt>0){
        const cover=g.assets()/r.debt*100;
        h+='<tr><td><b class="dn">借款</b></td><td><b class="dn">−'+money(r.debt)+'</b></td>'+
           '<td colspan="2">維持率 '+cover.toFixed(0)+'%</td></tr>';
      }
      host.innerHTML=h+'</table>';
    }
  }
  const sv=$('pk-chart');
  if(sv){
    if(navHist.length<2){ sv.innerHTML=''; }
    else{
      const all=navHist.concat(benchHist).map(v=>Math.log10(Math.max(0.5,v)));
      const mn=Math.min.apply(null,all), mx=Math.max.apply(null,all), rg=(mx-mn)||1;
      const line=(arr,color,w)=>{
        const pts=arr.map((v,i)=>{
          const x=(i/(navHist.length-1||1))*596+2;
          const y=114-((Math.log10(Math.max(0.5,v))-mn)/rg)*108;
          return x.toFixed(1)+','+y.toFixed(1);
        }).join(' ');
        return '<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="'+w+'"/>';
      };
      sv.innerHTML=line(benchHist,'var(--dim)',1.2)+line(navHist,'var(--accent)',2);
    }
  }
}
(function(){
  const open=$('c-peek'), close=$('peek-close'), pk=$('peek');
  if(open) open.onclick=()=>{ if(g){ renderPeek(); if(pk&&pk.classList)pk.classList.add('show'); } };
  if(close) close.onclick=()=>{ if(pk&&pk.classList)pk.classList.remove('show'); };
  if(pk) pk.onclick=e=>{ if(e&&e.target===pk&&pk.classList)pk.classList.remove('show'); };
})();

/* ================= 年循環 =================
   內核呼叫順序與改版前完全相同：
   openYear → deferEvent → addAlloc×n → autoAllocate → skipRest →
   beginEvent → answerEvent×n → riskCheck → midWindow/playMid → closeYear。
   順序動一格，同一顆種子就是另一條人生。 */
function nextYear(){
  if(g.over){ ending(); return; }
  if(g.raw.year===6 && !g.raw.careerSet){ careerAsk(); return; }
  openYear();
}
function careerAsk(){
  const s=g.raw.allocStats||{}, proScore=(s.invest||0)*.4+(s.research||0)*.35+(s.funds||0)*.25;
  const opts=[
    {t:'去上班',main:1,s:'每年有穩定收入，可以繼續投入',f:()=>{
      g.raw.careerSet=1; g.career('job');
      card('info','二十二歲 · 職涯選擇','<b>去上班</b><br>你決定去上班。一邊工作，一邊繼續投資。');
      openYear();
    }}
  ];
  if(proScore>=34) opts.push({t:'全職操作',warn:1,s:'能力達標｜沒有薪水，生活每年 −6',f:()=>{
    g.raw.careerSet=1; g.career('pro');
    card('info','二十二歲 · 職涯選擇','<b>全職操作</b><br>你的操作能力達到全職門檻。你決定不領固定薪水，靠投資走下去。');
    openYear();
  }});
  ask('二十二歲','畢業了。接下來要怎麼走？'+(proScore<34?'<br><span class="s">（全職操作需要操作能力 34，你目前 '+Math.round(proScore)+'）</span>':''),opts);
}
function openYear(){
  const o=g.openYear();
  if(!o){ ending(); return; }
  g.deferEvent();
  startYearSec(g.raw.year);
  paint();
  const r=g.raw;
  const cashFlow=o.income>0
    ? (r.age<19?'零用錢與打工':r.age<22?'打工存款':'工作收入')+'存下 <b class="up">'+money(o.income)+'</b>，已加入現金。'
    : '全職操作沒有固定收入，本年現金 <b>＋0</b>。';
  const clues=(r.signals||[]).map(s=>'<span class="sigline'+(s.id==='theme'?' theme':'')+'"><i>'+
    (s.id==='theme'?'★':'▸')+'</i><span>'+esc(s.t)+'</span></span>').join('<br>');
  let body='<b>年度金流</b>：'+cashFlow;
  if(r.planNote) body+='<br><b class="up">'+esc(r.planNote)+'</b>';
  if(clues) body+='<br><br><b>今年看到的市場現象</b><br>'+clues;
  if(g.raw.year===0){
    card('info','投資者誕生','2026 年春天，16 歲的你用壓歲錢開了第一個投資帳戶。未來的錢要放在哪裡，要自己選。'+
      '<br><span class="s">提示：每項能力有不同天賦值；超過天賦後仍能成長，但需要更多點數。真正最高是 80。</span>');
  }
  card('','年度開始',body);
  (r.notes||[]).forEach(n=>card('bad','',esc(n)));
  setLamp(0);
  gate('年初規劃（'+r.dice.length+' 顆骰子）',allocCard);
}

/* ================= 配點卡 =================
   骰子、五列、復原與確認全部在同一張卡裡，卡就長在流的尾端。
   卡有多高，頁面就多長——沒有任何东西需要被固定、被捲、被搬家。 */
const ROWS=[
  {id:'invest',  n:'投資', d:'提升持股操作帶來的年度績效'},
  {id:'research',n:'研究', d:'提高研究個股時的判斷準確率'},
  {id:'habit',   n:'紀律', d:'減少操作衝動波動與風險檢查機率'},
  {id:'life',    n:'生活', d:'減少生活狀態不佳造成的績效折損'},
  {id:'funds',   n:'資金', d:'降低借款利息與資金危機機率'}
];
function allocCard(){
  const r=g.raw;
  const free=[]; for(let i=0;i<r.dieUsed.length;i++) if(!r.dieUsed[i]) free.push(i);
  const alloc=[];        /* [{row, points, dieIdx}] 依骰子順序 */
  const box=dockOpen('年初規劃 · '+r.age+' 歲','alloc');
  if(!box)return;
  const q=document.createElement('div');
  q.className='dockq'; q.textContent='把每顆骰子的點數分配到一個項目，全部分完再確認。';
  box.appendChild(q);
  const inner=document.createElement('div');
  box.appendChild(inner);
  function pend(id){ return alloc.filter(a=>a.row===id).reduce((n,a)=>n+a.points,0); }
  function render(){
    const next=free[alloc.length];
    const caps=r.allocCaps||{};
    inner.innerHTML=
      '<div class="dice">'+r.dice.map((v,i)=>{
        if(r.dieUsed[i]) return '<span class="dz used"><i>'+v+'</i><em>追高</em></span>';
        const p=free.indexOf(i), a=alloc[p];
        if(a) return '<span class="dz done"><i>'+v+'</i><em>'+esc((ROWS.find(x=>x.id===a.row)||{}).n||'')+'</em></span>';
        return '<span class="dz'+(p===alloc.length?' now':'')+'"><i>'+v+'</i><em>'+(p===alloc.length?'現在':'待分配')+'</em></span>';
      }).join('')+'</div>'+
      ROWS.map(x=>{
        const pv=g.allocPreview(x.id,pend(x.id)), capped=pv.value>=80;
        const cap=caps[x.id]||80;
        const off=next==null||capped;
        return '<button class="arow" data-row="'+x.id+'"'+(off?' disabled':'')+'>'+
          '<span class="an">'+esc(x.n)+'</span>'+
          '<span class="ad">'+esc(x.d)+'</span>'+
          '<span class="put">'+pv.value+' <small>/ 天賦 '+cap+'</small>'+
            (pend(x.id)?'<small class="up">'+(pv.gained?'本年 ＋'+pv.gained:'升級進度 '+pv.carry+' / '+pv.cost)+'</small>':
             '<small>'+(capped?'已達最高 80':next==null?'已分完':(pv.cost>1?'升級需 '+pv.cost+' 點':'點一下分配'))+'</small>')+
          '</span>'+
          '<span class="bar"><i style="width:'+Math.min(100,pv.value/80*100)+'%"></i>'+
            '<em style="left:'+Math.min(100,cap/80*100)+'%"></em></span>'+
        '</button>';
      }).join('')+
      '<div class="aacts"><button data-a="undo"'+(alloc.length?'':' disabled')+'>↩ 復原</button>'+
      '<button data-a="ok" class="main"'+(alloc.length===free.length?'':' disabled')+'>'+
        (alloc.length===free.length?'確認分配':'還有 '+(free.length-alloc.length)+' 顆')+'</button></div>';
    inner.querySelectorAll('button').forEach(b=>{
      b.onclick=()=>{
        if(b.disabled)return;
        if(b.dataset.a==='undo'){ alloc.pop(); render(); return; }
        if(b.dataset.a==='ok'){ confirm(); return; }
        const row=b.dataset.row, dieIdx=free[alloc.length];
        if(row==null||dieIdx==null)return;
        alloc.push({row:row,points:r.dice[dieIdx],dieIdx:dieIdx});
        render();
      };
    });
  }
  function confirm(){
    dockClear();
    const grown=[];
    ROWS.forEach(x=>{
      const pts=pend(x.id); if(!pts)return;
      const before=r.allocStats[x.id]||0, res=g.addAlloc(x.id,pts);
      grown.push('<b>'+esc(x.n)+'</b> '+before+(res.gained?' → <b class="up">'+res.value+'</b>':
        '（升級進度 '+res.carry+' / '+res.cost+'）'));
    });
    const auto=g.autoAllocate();
    grown.push('<b>市場現象判讀</b> '+(auto.outlook>3?'偏多':auto.outlook<-3?'偏空':'方向不明')+
      '｜投入比例 '+Math.round(auto.exposure*100)+'%'+(auto.adjust?'（訊號 '+sgn(auto.adjust*100,1)+'%）':'')+
      '<br><b>自動配置</b> 本年投入 <b class="hl">'+money(auto.amount)+'</b>：市值型 ETF ＋ '+esc(auto.theme)+'題材');
    card('good','能力成長',grown.join('<br>'));
    paint();
    if(g.raw.apLeft>0) g.skipRest();
    /* beginEvent 照原本的順序呼叫（內核狀態推進），
       但事件內容等玩家按了閘門才揭曉 */
    if(g.beginEvent()) gate('市場事件',eventStep);
    else gate('投資風險檢查',riskStep);
  }
  render();
  scrollEnd();
}

/* ================= 市場事件 ================= */
function eventStep(){
  const e=g.event();
  if(!e){ riskStep(); return; }
  setLamp(1);
  /* 選項標題用卡片原文——「退群，不玩這個」是一件事，「保守應對」是
     把同一件事縮放三次的難度旋鈕外皮（設計文件自己批評過的模式）。
     風險姿態交給按鈕顏色與賭注數字，不用形容詞。 */
  ask('市場事件 · '+esc(e.n),esc(e.d),e.opts.map(o=>({
    t:o.action,
    main:o.t==='照常執行',
    warn:o.t==='全力投入',
    /* 成功率＋好壞範圍一起亮出來（借野球模擬器）——
       「風險較高」是形容詞，賭注的具體數字才是資訊 */
    s:(o.need?'因為你有「'+esc(KERNEL.HABITS[o.need].n)+'」<br>':'')+
      (o.gamble
        ? '<b>成功率 '+o.chance+'%</b>｜成功 '+esc(o.win||'—')+'｜失敗 '+esc(o.lose||'—')
        : '必然'+(o.win?'｜'+esc(o.win):'')),
    f:()=>{
      const r=g.answerEvent(o.i);
      if(r){
        /* 衝動的顏色照「回中/離中」塗，不照正負——
           tilt 60 的人 +8 是膨脹（紅），tilt 40 的人 +8 是回穩（綠） */
        const fx=r.eff.length?'<br>'+r.eff.map(x=>'<b class="'+
          (x.k==='tilt' ? (x.away?'dn':'up') : (x.v>=0?'up':'dn'))+
          '">'+esc(x.t)+'</b>').join('　'):'';
        card(r.gamble?(r.ok?'good':'bad'):'info',esc(r.card),
          '<b>'+esc(r.opt)+'</b><br>'+esc(r.text)+fx);
      }
      paint();
      if(g.event()) gate('下一個市場事件',eventStep);
      else gate('投資風險檢查',riskStep);
    }
  })));
}

/* ================= 年末：風險 → 年中窗口 → 結算 ================= */
function riskStep(){
  setLamp(2);
  const r=g.riskCheck();
  if(r){
    const cls=r.kind==='safe'?'info':'bad';
    const title=r.kind==='safe'?'風險正常':r.kind==='minor'?'小額損失':'重大資金危機';
    card(cls,'投資風險檢查｜'+title,esc(r.text)+
      '<br>本年發生風險的機率 <b>'+r.p+'%</b>'+
      (r.loss>0?'<br><b class="dn">資產減少 '+money(r.loss)+'</b>':''));
    paint();
  }
  const w=g.midWindow();
  if(w) midAsk(w); else gate('年末結算',settle);
}
function midAsk(w){
  const crash=w.kind==='crash';
  const desc=crash?'指數跌了 '+Math.abs(w.sofar)+'%，還沒止住。':'指數漲了 '+w.sofar+'%，市場情緒偏熱。';
  ask('市場波動應對',esc(desc),w.options.map(o=>({
    t:o.label,
    warn:o.id==='add'&&!crash,
    s:[o.n,o.s].filter(Boolean).map(esc).join('　'),
    f:()=>{
      const res=g.playMid(o.id);
      if(!res) card('bad','年中','沒買成——可投入的現金不夠。');
      else if(o.id==='cut'){
        if(res.sold.length) card('good','年中',res.sold.map(id=>esc(KERNEL.BY_ID[id].n)).join('、')+' 砍掉了。');
        if(res.failed.length) card('bad','年中',
          res.failed.map(id=>esc(KERNEL.BY_ID[id].n)).join('、')+' <b class="dn">跌停鎖死，賣不掉</b>。');
      }
      else if(o.id==='add') card('','年中',(crash?'往下加碼了':'又追了一筆')+'，投入 <b class="hl">'+money(res.bought)+'</b>。');
      else if(o.id==='take') card('good','年中','獲利了結一半。');
      else card('','年中','你什麼都沒做。');
      paint();
      gate('年末結算',settle);
    }
  })));
}
function settle(){
  const row=g.closeYear();
  if(!row){ ending(); return; }
  navHist.push(row.nav);
  benchHist.push(g.raw.benchSh*g.raw.price.wide);
  const rg=KERNEL.REGIME[row.rg];
  const perf='<b class="'+(row.mkt>=0?'up':'dn')+'">'+esc(rg.n)+'　市場 '+sgn(row.mkt)+'%</b>　'+
    '<b class="'+(row.ret>=0?'up':'dn')+'">你的投資 '+sgn(row.ret)+'%</b><br>'+
    (row.ret>=row.mkt?'<span class="up">今年跑贏市場 '+(row.ret-row.mkt).toFixed(1)+'%</span>':
      '<span class="dn">今年落後市場 '+(row.mkt-row.ret).toFixed(1)+'%</span>');
  let body='年末總資產 <b class="hl">'+money(row.nav)+'</b>'+
    '<br>手上現金 <b class="hl">'+money(g.raw.cash)+'</b>'+
    (g.raw.debt>0?'<br>尚未償還 <b class="dn">'+money(g.raw.debt)+'</b>':'<br><span class="up">目前沒有借款</span>');
  if(row.div>0.05) body+='<br>今年收到股利 <b class="up">'+money(row.div)+'</b>';
  if(row.blew) body+='<br><b class="dn">維持率跌破 130%，被強制平倉。</b>';
  const traitName={craft:'研究派',safe:'穩健派',life:'生活派'}[row.trait]||'研究派';
  body+='<br><b>自動配置</b>：'+Math.round((row.exposure||0)*100)+'% 資金投入市值型 ETF'+
    ' 與題材股；市值型 ETF 今年 <b class="'+(row.autoMarketPct>=0?'up':'dn')+'">'+sgn(row.autoMarketPct,2)+'%</b>';
  if(row.autoDecision) body+='<br><b>市場現象判讀</b>：'+
    (row.autoDecision.outlook>3?'偏多，多投入 ':row.autoDecision.outlook<-3?'偏空，少投入 ':'方向不明，調整 ')+
    '<b class="'+(row.autoDecision.adjust>=0?'up':'dn')+'">'+sgn(row.autoDecision.adjust*100,1)+'%</b>；'+
    esc(row.autoDecision.theme)+'題材投入 '+money(row.autoDecision.themeAmount||0);
  body+='<br><b>'+traitName+'能力加成</b>：操作績效 <b class="'+(row.abilityPct>=0?'up':'dn')+'">'+
    sgn(row.abilityPct,2)+'%</b>（本年 '+(row.abilityGain>=0?'增加 ':'減少 ')+money(Math.abs(row.abilityGain))+'）';
  const partName={invest:'投資',research:'研究',habit:'紀律',life:'生活',funds:'資金'};
  if(row.abilityParts) body+='<br><span class="s">'+Object.keys(partName).map(k=>partName[k]+' '+sgn(row.abilityParts[k]||0,2)+'%').join('　')+
    (row.lifePenalty<0?'　狀態不佳 '+sgn(row.lifePenalty,2)+'%':'')+'</span>';
  card(row.ret>=0?'good':'bad','年末結算',perf+'<br><br>'+body);
  if(row.form!==0){
    const hot=row.form>0;
    card(hot?'gold':'bad',hot?'手感極佳':'操作失常',(hot?
      '今年判斷特別順，五項能力帶來的績效效果變成 <b class="up">1.2 倍</b>。':
      '今年幾次判斷沒有做好，五項能力帶來的績效效果只發揮 <b class="dn">65%</b>。')+
      '<br>能力值沒有改變，明年會重新判定。');
  }
  paint();
  if(g.over){
    ask('投資人生完成','',[{t:'查看人生總結',main:1,f:ending}]);
    return;
  }
  const choices=[
    {k:'craft',t:'多做研究',s:'下一年有 50% 機率多看 1 條消息',result:'下一年有 50% 機率多看到 1 條市場消息。'},
    {k:'safe', t:'控制風險',s:'下一年操作衝動 −6',result:'下一年操作衝動 −6，較不容易追高。'},
    {k:'life', t:'顧好生活',s:'下一年年初生活 +6',result:'下一年年初生活狀態 +6。'}
  ];
  const opts=choices.map(x=>({
    t:x.t, main:x.k===plan, s:esc(x.s),
    f:()=>{
      plan=x.k; g.setPlan(plan);
      card('info','下一年度投資重點','<b>'+esc(x.t)+'</b><br>'+esc(x.result));
      nextYear();
    }
  }));
  /* 自主收手：30 歲以上、淨值站上 600 萬才出現。
     不是難度選項，是股市人生最重要的一課——知道什麼時候離場。 */
  if(g.canWalkaway&&g.canWalkaway()) opts.push({
    t:'收手，把錢搬去過生活', warn:1,
    s:'結束投資人生，現在結算',
    f:()=>{ if(g.walkaway()) ending(); else nextYear(); }
  });
  ask('下一年怎麼做？','選擇下一年度的投資重點。',opts);
}

/* ================= 結局 ================= */
function ending(){
  const e=g.ending;
  const endAge=e.age==null?g.raw.age:e.age;
  const tile=(k,v,cls)=>'<div class="tl"><span>'+k+'</span><b'+(cls?' class="'+cls+'"':'')+'>'+v+'</b></div>';
  const feed=$('feed');
  if(feed){
    if(yearSec&&yearSec.classList) yearSec.classList.add('collapsed');
    yearSec=null;   /* 結局卡放在最外層，不收進任何一年 */
    const d=document.createElement('div');
    d.className='card end';
    d.innerHTML='<h4>'+endAge+' 歲 · 結算</h4><div class="endt">'+esc(e.t)+'</div>'+
      '<div class="endnav"><span>淨值</span><b>'+money(e.nav)+'</b></div>'+
      '<div class="grid">'+
        tile('年化',sgn(e.cagr)+'%',e.cagr>=0?'up':'dn')+
        tile('贏過 ETF',sgn(e.edge)+'%',e.edge>=0?'up':'dn')+
        tile('生活',Math.round(e.life))+
        tile('信任',Math.round(e.trust==null?50:e.trust))+
        tile('家庭',famLabel(e.love))+
        tile('存進去',money(e.inflow))+
        tile('ETF 對照',money(e.bench))+
        tile('股利',money(e.div))+
        tile('稅費',money(e.tax))+
        tile('交易',e.trades+' 次')+
        tile('斷頭',e.blowups+' 次')+
      '</div>';
    feed.appendChild(d);
  }
  /* 「後來」：每個結局的第二人生（素材來自真實案例）。
     終止不是懲罰，是敘事出口。 */
  if(e.story) card('info','後來',esc(e.story));
  track('end-'+e.id);
  endAsk(e);
  paint();
}
function famLabel(L){
  if(!L) return '—';
  if(L.st==='married') return '已婚'+(L.kids?'·'+L.kids+'孩':'');
  if(L.st==='dating') return '交往中';
  if(L.exes&&L.kids) return '離婚·'+L.kids+'孩';
  return L.exes?'分過手':'單身';
}
/* ---- 分享結局：病毒的載體是玩家貼出去的那段文字 ----
   帶種子連結＝隱形戰帖：對方點開就是同一顆種子，「你會活得比我好嗎」。 */
function endAsk(e){
  ask('投資 '+e.years+' 年，結束了','',[
    {t:'複製結局，貼去嗆人',main:1,f:()=>{ copyEnding(e); endAsk(e); }},
    {t:'再玩一次（同一顆種子）',f:()=>location.reload()},
    {t:'換一顆種子',f:()=>{ location.href=location.pathname; }}
  ]);
}
function copyEnding(e){
  const seed=new URLSearchParams(location.search).get('seed')||'';
  const url=location.origin+location.pathname+(seed?'?seed='+encodeURIComponent(seed):'');
  const story=(e.story||'').split('。')[0];
  const txt='【少年股神】'+(e.age||40)+' 歲結算：'+e.t+'\n'+
    '淨值 '+money(e.nav)+'｜年化 '+sgn(e.cagr)+'%｜'+(e.edge>=0?'贏過':'輸給')+' ETF '+sgn(Math.abs(e.edge))+'%\n'+
    '生活 '+Math.round(e.life)+'・信任 '+Math.round(e.trust==null?50:e.trust)+'・家庭 '+famLabel(e.love)+'\n'+
    (story?'「後來」：'+story+'。\n':'')+
    '同一顆種子，你會活得比我好嗎？\n'+url;
  let ok=false;
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt); ok=true; }
  }catch(err){}
  track('share');
  card('info',ok?'已複製，拿去吧':'手動複製這段',
    esc(txt).replace(/\n/g,'<br>'));
}
</script>
