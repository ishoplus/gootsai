/* 就地重置。整頁 reload 在 file:// 和 sandbox iframe 下都可能失靈或掉種子 */
function restart(keepSeed){
  if(!keepSeed) SEED=Math.random().toString(36).slice(2,10);
  S=null;
  LOG().innerHTML=''; actClear();
  $('game').classList.remove('on');
  $('start').style.display='flex';
  $('ver').style.display='';
  $('seed-show').value=SEED;
  renderCodexLine();
  window.scrollTo(0,0);
}
function st(k,v){ return '<div class="st"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'; }
function copy(t){
  const fallback=()=>{
    try{
      const i=document.createElement('textarea');
      i.value=t; i.style.position='fixed'; i.style.opacity='0';
      document.body.appendChild(i); i.select();
      document.execCommand('copy'); i.remove();
    }catch(_){}
  };
  try{
    const pr = navigator.clipboard && navigator.clipboard.writeText(t);
    /* writeText 回傳 Promise，權限被擋時是非同步 reject，try/catch 接不到 */
    if(pr && pr.catch){ pr.catch(fallback); return; }
  }catch(e){}
  fallback();
}

/* ---- 結局分享圖（純呈現層，不得呼叫 R()）----
   畫成 canvas 後直接以 <img> 嵌進頁面，讓人長按或右鍵存圖。
   刻意不做 download 連結：在 artifact 的 sandbox iframe 裡那種連結是死的。 */
function buildShareCard(E,nav,cagr){
  const W=1080,H=1800,P=72;   /* 先畫在夠高的畫布上，最後依內容裁掉多餘的部分 */
  const cv=document.createElement('canvas');
  cv.width=W; cv.height=H;
  const c=cv.getContext('2d');
  if(!c) return;
  const cs=getComputedStyle(document.body);
  const V=n=>cs.getPropertyValue(n).trim();
  const BG=V('--bg')||'#080c0a', INK=V('--ink')||'#d8e6de', DIM=V('--dim')||'#6f8579',
        AC=V('--accent')||'#34d17e', UP=V('--up')||'#3ddc84', DN=V('--dn')||'#ff5c5c',
        ED=V('--edge')||'#1e2c25', GD=V('--gold')||'#ffd166', PN=V('--panel')||'#0e1512';
  const SANS=V('--sans')||'sans-serif', SERIF=V('--serif')||'serif', MONO=V('--mono')||'monospace';

  c.fillStyle=BG; c.fillRect(0,0,W,H);

  /* 頂部漲跌帶 */
  const grd=c.createLinearGradient(0,0,W,0);
  grd.addColorStop(0,UP); grd.addColorStop(.5,DN); grd.addColorStop(1,UP);
  c.fillStyle=grd; c.globalAlpha=.75; c.fillRect(0,0,W,6); c.globalAlpha=1;

  let y=P+70;
  c.fillStyle=INK; c.font='900 62px '+SERIF; c.fillText('少年股神',P,y);
  c.fillStyle=AC; c.font='500 20px '+MONO;
  c.fillText('T H E   T E E N A G E   O R A C L E',P,y+38);

  /* 結局 */
  y+=118;
  c.fillStyle=GD; c.font='500 24px '+MONO;
  c.fillText(E.rank,P,y);
  y+=62;
  c.fillStyle=INK; c.font='700 52px '+SERIF;
  y=wrapText(c,E.title,P,y,W-P*2,62);   /* 回傳值是最後一行的基線之下 */

  /* 姓名與身分 */
  y+=40;
  c.fillStyle=DIM; c.font='400 26px '+SANS;
  c.fillText(S.name+'　16 → 40 歲　'+CAREER[S.career].n,P,y);

  /* 淨值曲線 */
  y+=46;
  const CH=340, CX=P, CY=y, CW=W-P*2;
  c.fillStyle=PN; c.fillRect(CX,CY,CW,CH);
  c.strokeStyle=ED; c.lineWidth=1; c.strokeRect(CX+.5,CY+.5,CW-1,CH-1);
  const h=S.navHist;
  if(h.length>1){
    const lg=h.map(v=>Math.log10(Math.max(0.05,v)));
    const mn=Math.min.apply(null,lg), mx=Math.max.apply(null,lg), rg=(mx-mn)||1;
    const X=i=>CX+28+(i/(h.length-1))*(CW-70);
    const Y=v=>CY+CH-46-((v-mn)/rg)*(CH-92);
    /* 熊市與崩盤陰影 */
    c.fillStyle=DN; c.globalAlpha=.12;
    S.log.forEach((L,i)=>{ if(L.rg==='crash'||L.rg==='bear'){
      const a=X(i), b=X(Math.min(i+1,h.length-1));
      c.fillRect(a,CY+10,Math.max(3,b-a),CH-20);
    }});
    c.globalAlpha=1;
    c.strokeStyle=ED; c.setLineDash([4,6]); c.beginPath();
    c.moveTo(CX+20,Y(lg[0])); c.lineTo(CX+CW-20,Y(lg[0])); c.stroke(); c.setLineDash([]);
    c.strokeStyle = h[h.length-1]>=h[0]?UP:DN;
    c.lineWidth=4; c.lineJoin='round'; c.lineCap='round'; c.beginPath();
    lg.forEach((v,i)=>{ i?c.lineTo(X(i),Y(v)):c.moveTo(X(i),Y(v)); });
    c.stroke();
    c.fillStyle=c.strokeStyle;
    c.beginPath(); c.arc(X(lg.length-1),Y(lg[lg.length-1]),8,0,7); c.fill();
    c.fillStyle=DIM; c.font='400 22px '+MONO;
    c.fillText(fmtM(h[0]),CX+22,Y(lg[0])+34);
    c.fillStyle=INK; c.font='700 26px '+MONO;
    c.textAlign='right'; c.fillText(fmtM(nav),CX+CW-22,Y(lg[lg.length-1])-22); c.textAlign='left';
  }
  y=CY+CH+64;

  /* 資料格 */
  const cells=[
    ['最終淨值',fmtM(nav),INK],
    ['淨值年化',sgn(cagr)+'%',cagr>=0?UP:DN],
    ['最大回撤',(S.peak>0?-(1-nav/S.peak)*100:0).toFixed(0)+'%',nav<S.peak?DN:DIM],
    ['斷頭',S.blowups+' 次',S.blowups?DN:DIM],
    ['心態',String(Math.round(S.mood)),INK],
    ['生活',String(Math.round(S.life)),INK]
  ];
  const cw=(W-P*2-24*2)/3;
  cells.forEach((cell,i)=>{
    const cx=P+(i%3)*(cw+24), cy=y+Math.floor(i/3)*126;
    c.fillStyle=PN; c.fillRect(cx,cy,cw,104);
    c.strokeStyle=ED; c.strokeRect(cx+.5,cy+.5,cw-1,103);
    c.fillStyle=DIM; c.font='400 21px '+MONO; c.fillText(cell[0],cx+20,cy+36);
    c.fillStyle=cell[2]; c.font='700 40px '+MONO; c.fillText(cell[1],cx+20,cy+82);
  });
  y+=126*2+22;

  /* 特質 */
  const tk=Object.keys(S.traits);
  c.fillStyle=DIM; c.font='400 22px '+MONO; c.fillText('TRAITS',P,y);
  y+=42;
  if(tk.length){
    let x=P;
    c.font='500 26px '+SANS;
    tk.forEach(k=>{
      const label=TRAITS[k].n, tw=c.measureText(label).width+34;
      if(x+tw>W-P){ x=P; y+=54; }
      c.strokeStyle=TRAITS[k].good?AC:DN; c.lineWidth=1.5;
      c.strokeRect(x+.5,y-30.5,tw,44);
      c.fillStyle=TRAITS[k].good?AC:DN;
      c.fillText(label,x+17,y);
      x+=tw+14;
    });
  } else {
    c.fillStyle=DIM; c.font='400 26px '+SANS; c.fillText('（一個都沒有）',P,y);
  }

  /* 頁尾種子：位置跟著內容走，不寫死在畫布底部 */
  const fy=y+78;
  c.fillStyle=ED; c.fillRect(P,fy-40,W-P*2,1);
  c.fillStyle=DIM; c.font='400 24px '+MONO;
  c.fillText('SEED',P,fy);
  c.fillStyle=AC; c.font='700 28px '+MONO;
  c.fillText(SEED,P+82,fy);
  c.fillStyle=DIM; c.font='400 20px '+SANS;
  c.textAlign='right';
  c.fillText('相同種子＋相同選擇＝相同人生',W-P,fy);
  c.textAlign='left';

  /* 裁掉底下沒用到的空白 */
  const FH=Math.min(H,Math.round(fy+56));
  const out=document.createElement('canvas');
  out.width=W; out.height=FH;
  const o=out.getContext('2d');
  o.fillStyle=BG; o.fillRect(0,0,W,FH);
  o.drawImage(cv,0,0,W,FH,0,0,W,FH);

  /* 嵌進結局頁 */
  let url;
  try{ url=out.toDataURL('image/png'); }catch(e){ return; }
  const wrap=document.createElement('div');
  wrap.className='share';
  wrap.innerHTML='<div class="k">分享圖</div><img src="'+url+'" alt="'+esc(S.name)+' 的結局分享圖">'+
    '<div class="hint">長按或按右鍵存圖。圖上有種子碼，朋友輸入就能走同一條路。</div>';
  const fin=$('fin'); if(fin) fin.appendChild(wrap);
}
/* 回傳最後一行的基線 y；呼叫端自行決定往下留多少 */
function wrapText(c,txt,x,y,maxW,lh){
  let line='';
  for(const ch of txt){
    if(c.measureText(line+ch).width>maxW && line){ c.fillText(line,x,y); y+=lh; line=ch; }
    else line+=ch;
  }
  if(line) c.fillText(line,x,y);
  return y;
}

/* 結局淨值曲線（純呈現層，不得呼叫 R()）*/
function drawChart(){
  const cv=$('chart'); if(!cv||!cv.getContext) return;
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth||720, H=200;
  cv.width=W*dpr; cv.height=H*dpr;
  const c=cv.getContext('2d'); c.scale(dpr,dpr);
  const cs=getComputedStyle(document.body);
  const CD=cs.getPropertyValue('--dim').trim()||'#777';
  const CU=cs.getPropertyValue('--up').trim()||'#3c8';
  const CN=cs.getPropertyValue('--dn').trim()||'#c33';
  const CE=cs.getPropertyValue('--edge').trim()||'#333';
  const P=34;
  const h=S.navHist;
  if(h.length<2) return;
  const logs=h.map(v=>Math.log10(Math.max(0.05,v)));
  const mn=Math.min.apply(null,logs), mx=Math.max.apply(null,logs), rg=(mx-mn)||1;
  const X=i=>P+(i/(h.length-1))*(W-P*1.4);
  const Y=v=>H-P+8-((v-mn)/rg)*(H-P*1.7);

  /* 崩盤年陰影 */
  c.fillStyle=CN; c.globalAlpha=.10;
  S.log.forEach((y,i)=>{ if(y.rg==='crash'||y.rg==='bear'){
    const x0=X(i), x1=X(Math.min(i+1,h.length-1));
    c.fillRect(x0,10,Math.max(2,x1-x0),H-40);
  }});
  c.globalAlpha=1;

  /* 起始線 */
  c.strokeStyle=CE; c.setLineDash([3,4]); c.beginPath();
  c.moveTo(P,Y(logs[0])); c.lineTo(W-P*0.4,Y(logs[0])); c.stroke(); c.setLineDash([]);

  /* 鬼影：同一顆種子的上一次 */
  if(S.ghost){
    c.strokeStyle=CD; c.lineWidth=1.5; c.setLineDash([3,4]); c.globalAlpha=.8; c.beginPath();
    S.ghost.hist.slice(0,h.length).forEach((v,i)=>{
      const y=clamp(Y(Math.log10(Math.max(0.05,v))),8,H-14);
      i?c.lineTo(X(i),y):c.moveTo(X(i),y);
    });
    c.stroke(); c.setLineDash([]); c.globalAlpha=1;
  }

  /* 對照組兩條線 */
  const drawBench=(arr,color,dash)=>{
    if(!arr||arr.length<2) return;
    c.strokeStyle=color; c.lineWidth=1.4; c.setLineDash(dash); c.globalAlpha=.9; c.beginPath();
    arr.slice(0,h.length).forEach((v,i)=>{
      const y=clamp(Y(Math.log10(Math.max(0.05,v))),8,H-14);
      i?c.lineTo(X(i),y):c.moveTo(X(i),y);
    });
    c.stroke(); c.setLineDash([]); c.globalAlpha=1;
  };
  drawBench(S.bIdxH, CD, []);
  drawBench(S.bTsmH, getComputedStyle(document.body).getPropertyValue('--warn').trim()||'#fc0', [5,3]);

  /* 曲線 */
  c.strokeStyle = h[h.length-1]>=h[0]?CU:CN;
  c.lineWidth=2; c.lineJoin='round'; c.beginPath();
  logs.forEach((v,i)=>{ i?c.lineTo(X(i),Y(v)):c.moveTo(X(i),Y(v)); });
  c.stroke();

  /* 標註 */
  c.fillStyle=CD; c.font='10px '+(cs.getPropertyValue('--mono')||'monospace');
  c.fillText(fmtM(h[0]),4,Y(logs[0])-5);
  c.fillText(fmtM(h[h.length-1]),W-P*1.2,Y(logs[logs.length-1])-6);
  c.fillText('16歲',P-8,H-8);
  c.fillText(String(16+h.length-2)+'歲',W-P*1.1,H-8);
  c.fillText('seed: '+SEED,4,12);
}

/* ================= 戰帖碼 =================
   把一整局的結果壓進網址，不需要後端。收到連結的人拿到同一顆種子，
   而且對方的淨值曲線會變成灰線跟著他跑——種子從「一個人重玩」變成「一群人比較」。
   淨值取 log10 再量化成兩位 base36，26 年只花 52 個字元。 */
function b36(n,w){ n=Math.max(0,Math.round(n)); let s=n.toString(36); while(s.length<w)s='0'+s; return s.slice(-w); }
function encodeRun(E){
  const si=Object.keys(SCHOOL).indexOf(S.school);
  const ei=Math.max(0,ENDING_IDS.findIndex(x=>x.id===E.id));
  const h=S.navHist.map(v=>b36(clamp(Math.round(Math.log10(Math.max(0.05,v))*100)+200,0,1295),2)).join('');
  return '1'+b36(si+1,1)+b36(ei,2)+h+'~'+encodeURIComponent(S.name.slice(0,6));
}
function decodeRun(code){
  try{
    if(!code || code.charAt(0)!=='1') return null;
    const cut=code.indexOf('~');
    const body=cut<0?code:code.slice(0,cut);
    let nm='某人';
    if(cut>=0){ try{ nm=clean(decodeURIComponent(code.slice(cut+1)),8)||'某人'; }catch(e){} }
    const si=parseInt(body.charAt(1),36)-1;
    const ei=parseInt(body.slice(2,4),36);
    const hs=body.slice(4), hist=[];
    for(let i=0;i+1<hs.length;i+=2){
      const q=parseInt(hs.slice(i,i+2),36);
      if(isNaN(q)) return null;
      hist.push(Math.pow(10,(q-200)/100));
    }
    if(hist.length<3) return null;
    const E=ENDING_IDS[ei]||{t:'不明的結局',r:''};
    return {name:nm, school:Object.keys(SCHOOL)[si]||null,
            hist:hist, nav:hist[hist.length-1], title:E.t, rank:E.r, vs:true};
  }catch(e){ return null; }
}
function challengeURL(E){
  const base = location.origin.startsWith('http')
    ? location.origin+location.pathname : location.href.split('?')[0];
  return base+'?seed='+encodeURIComponent(SEED)+'&vs='+encodeRun(E);
}

/* ================= 數據 =================
   GoatCounter：免費、不放 cookie、不需要同意橫幅，一行設定就啟用。
   把 GC_CODE 換成你註冊的代碼（例如註冊 gootsai.goatcounter.com 就填 'gootsai'）。
   留空則整段不做任何事，也不會發出任何請求。
   Artifact 版的 CSP 會擋掉外部腳本，所以數據只會來自 GitHub Pages 那個網址。 */
const GC_CODE = '';
let _gcReady=false;
function analyticsInit(){
  if(!GC_CODE || location.protocol==='file:') return;
  window.goatcounter={no_onload:true};
  const s=document.createElement('script');
  s.async=true; s.dataset.goatcounter='https://'+GC_CODE+'.goatcounter.com/count';
  s.src='https://gc.zgo.at/count.js';
  s.onload=()=>{ _gcReady=true; track('/'); };   /* 種子與戰帖碼一律歸到首頁，免得路徑爆炸 */
  document.head.appendChild(s);
}
function track(path,title){
  if(!_gcReady || !window.goatcounter || !goatcounter.count) return;
  try{ goatcounter.count({path:path, title:title||path, event:path.charAt(0)!=='/'}); }catch(e){}
}

/* ================= 本機存檔：圖鑑與種子歷史 =================
   全部包在 try/catch 裡——sandbox iframe 與隱私模式可能整個沒有 localStorage，
   那時遊戲照常能玩，只是少了鬼影與圖鑑。 */
const LS={
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
function codex(){ return LS.get('sg-codex',{ends:{},traits:{},schools:{},runs:0,best:0}); }
function seedBook(){ return LS.get('sg-seeds',{}); }

/* 記錄一局：更新圖鑑，並把這顆種子的淨值曲線存起來當下次的鬼影 */
function recordRun(E,nav){
  const cx=codex();
  cx.ends[E.id]=(cx.ends[E.id]||0)+1;
  Object.keys(S.traits).forEach(t=>cx.traits[t]=1);
  if(S.school) cx.schools[S.school]=(cx.schools[S.school]||0)+1;
  cx.runs=(cx.runs||0)+1;
  if(nav>(cx.best||0)) cx.best=nav;
  LS.set('sg-codex',cx);

  const bk=seedBook();
  bk[SEED]={
    nav:Math.round(nav*100)/100,
    hist:S.navHist.map(v=>Math.round(v*100)/100),
    title:E.title, rank:E.rank, school:S.school, name:S.name
  };
  /* 只留最近 30 顆種子，免得 localStorage 無限長大 */
  const keys=Object.keys(bk);
  if(keys.length>30) keys.slice(0,keys.length-30).forEach(k=>delete bk[k]);
  LS.set('sg-seeds',bk);
}
function loadGhost(){
  const g=seedBook()[SEED];
  return (g && g.hist && g.hist.length>2) ? g : null;
}
function codexProgress(){
  const cx=codex(), ne=Object.keys(cx.ends||{}).length, nt=Object.keys(cx.traits||{}).length;
  return {ends:ne, endsAll:ENDING_IDS.length, traits:nt, traitsAll:Object.keys(TRAITS).length,
          schools:Object.keys(cx.schools||{}).length, schoolsAll:Object.keys(SCHOOL).length,
          runs:cx.runs||0, best:cx.best||0};
}
function renderCodexLine(){
  const el=$('codex-line'); if(!el) return;
  const p=codexProgress();
  if(!p.runs){ el.innerHTML='<span style="opacity:.6">還沒有任何紀錄。第一局結束後這裡會開始長東西。</span>'; return; }
  el.innerHTML='已玩 <b>'+p.runs+'</b> 局 · 結局 <b>'+p.ends+'/'+p.endsAll+'</b>'+
    ' · 特質 <b>'+p.traits+'/'+p.traitsAll+'</b> · 流派 <b>'+p.schools+'/'+p.schoolsAll+'</b>'+
    ' · 最高 <b>'+fmtM(p.best)+'</b>　<a href="#" id="codex-open">看圖鑑</a>';
  const a=$('codex-open');
  if(a) a.onclick=e=>{ e.preventDefault(); openCodex(); };
}
function openCodex(){
  if($('mask')) return;
  const cx=codex();
  const row=(ok,name,desc)=>'<div class="cdx'+(ok?' on':'')+'"><b>'+(ok?name:'？？？')+'</b>'+
    '<span>'+(ok?desc:'尚未解鎖')+'</span></div>';
  const ends=ENDING_IDS.map(e=>row(cx.ends&&cx.ends[e.id],e.t,e.r+(cx.ends&&cx.ends[e.id]>1?'　×'+cx.ends[e.id]:''))).join('');
  const trs=Object.keys(TRAITS).map(k=>row(cx.traits&&cx.traits[k],TRAITS[k].n,TRAITS[k].fx)).join('');
  const scs=Object.keys(SCHOOL).map(k=>row(cx.schools&&cx.schools[k],SCHOOL[k].n,
    SCHOOL[k].fx+(cx.schools&&cx.schools[k]>1?'　走過 '+cx.schools[k]+' 次':''))).join('');
  const m=document.createElement('div');
  m.id='mask';
  m.innerHTML='<div class="sheet wide"><div class="q">圖鑑</div>'+
    '<div class="cdxg"><h4>結局</h4>'+ends+'<h4>特質</h4>'+trs+'<h4>流派</h4>'+scs+'</div>'+
    '<button class="btn main" id="cdx-close">關閉</button></div>';
  document.body.appendChild(m);
  m.onclick=e=>{ if(e.target===m) m.remove(); };
  $('cdx-close').onclick=()=>m.remove();
}

/* ================= 主題與偏好（純呈現層）================= */
function applyTheme(t){ document.body.dataset.theme=t; try{localStorage.setItem('sg-theme',t);}catch(e){} }
function applyBig(on){ document.body.classList.toggle('big',on); try{localStorage.setItem('sg-big',on?'1':'0');}catch(e){} }
(function(){
  try{
    const t=localStorage.getItem('sg-theme'); if(t) document.body.dataset.theme=t;
    if(localStorage.getItem('sg-big')==='1') document.body.classList.add('big');
  }catch(e){}
})();

/* 快速模式開局：先把往後二十四年的分配方針與事件立場定下來 */
function askPlan(){
  choose('往後這些年，你打算怎麼分配時間？',Object.keys(PLANS).map(k=>({
    t:PLANS[k].n, s:PLANS[k].d, main:k==='safe',
    f:()=>{ S.plan=k; askStance(); }
  })));
}
function askStance(){
  choose('遇到事件時，你的習慣是？',[
    {t:STANCE.safe, s:'成功率最高，但好處與壞處的幅度都最小（±1）',f:()=>startFast('safe')},
    {t:STANCE.norm, s:'標準幅度（±2）', main:true, f:()=>startFast('norm')},
    {t:STANCE.bold, s:'成功率最低，幅度最大（±3）。賭狗之路',f:()=>startFast('bold')}
  ]);
}
function startFast(st){
  S.stance=st;
  card('info','方針已定',
    '分配方針 <b class="hl">'+PLANS[S.plan].n+'</b>（'+PLANS[S.plan].d+'）、'+
    '事件立場 <b class="hl">'+STANCE[st]+'</b>。<br>'+
    '接下來每年你只需要決定一件事：<b class="hl">部位押多少</b>。'+
    '重大關卡（流派、生涯、生活警訊）還是會停下來問你。','PLAN');
  board(1);
  choose('',[{t:'▸ 開始',main:true,s:'種子 '+SEED+'｜這條路上會有幾次崩盤，你還不知道',f:nextYear}]);
}

/* ================= 開場 ================= */
let ORGPICK='greed', FASTPICK=false;
function boot(){
  $('seed-show').value=SEED;
  $('seed-re').onclick=e=>{ e.preventDefault(); SEED=Math.random().toString(36).slice(2,10); $('seed-show').value=SEED; };
  document.querySelectorAll('#seg-org button').forEach(b=>{
    b.onclick=()=>{ document.querySelectorAll('#seg-org button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); ORGPICK=b.dataset.v; };
  });
  document.querySelectorAll('#seg-mode button').forEach(b=>{
    b.onclick=()=>{ document.querySelectorAll('#seg-mode button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); FASTPICK=(b.dataset.v==='fast');
      $('mode-hint').textContent = FASTPICK
        ? '先定一次分配方針與事件立場，之後每年只需要決定部位。事件卡照樣會出現，只是不用逐張點。'
        : '每年親手分配骰子、逐張回應事件卡。'; };
  });
  document.querySelectorAll('[data-th]').forEach(a=>{
    a.onclick=e=>{ e.preventDefault(); applyTheme(a.dataset.th); };
  });
  $('big-t').onclick=e=>{ e.preventDefault(); applyBig(!document.body.classList.contains('big')); };
  $('menubtn').onclick=openMenu;
  analyticsInit();
  CHALLENGE=decodeRun(VSCODE);
  if(CHALLENGE){
    track('arrive-challenge','收到戰帖');
    const g=CHALLENGE;
    const el=$('vs-line');
    if(el){
      el.style.display='block';
      el.innerHTML='<b>'+esc(g.name)+'</b>'+(g.school?'（'+SCHOOL[g.school].n+'）':'')+
        ' 向你下了戰帖：這顆種子他走到 <b>'+fmtM(g.nav)+'</b>，結局是「'+g.title+'」。<br>'+
        '<span style="opacity:.7">種子已鎖定。同樣的牛熊，換你走一次。</span>';
    }
    const si=$('seed-show'); if(si) si.readOnly=true;
    const sr=$('seed-re'); if(sr) sr.style.display='none';
  }
  renderCodexLine();
  $('btn-start').onclick=start;
  $('in-name').addEventListener('keydown',e=>{ if(e.key==='Enter') start(); });
}

/* 選單是疊加層，不碰 #act，因此不會破壞進行中的骰子分配或選項 */
function openMenu(){
  if($('mask')) return;
  const m=document.createElement('div');
  m.id='mask';
  m.innerHTML='<div class="sheet"><div class="q">選單</div>'+
    '<button class="btn" data-a="tl">生涯時間軸</button>'+
    '<button class="btn" data-a="terminal">主題：終端綠</button>'+
    '<button class="btn" data-a="paper">主題：財經報</button>'+
    '<button class="btn" data-a="neon">主題：霓虹夜</button>'+
    '<button class="btn" data-a="big">切換字級</button>'+
    '<button class="btn" data-a="copy">複製本局種子連結<span class="s">'+SEED+'</span></button>'+
    '<button class="btn warn" data-a="restart">放棄這條人生，重開</button>'+
    '<button class="btn main" data-a="close">返回</button></div>';
  document.body.appendChild(m);
  const close=()=>m.remove();
  m.onclick=e=>{ if(e.target===m) close(); };
  m.querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{
      const a=b.dataset.a;
      if(a==='tl'){ close(); openTimeline(); return; }
      if(a==='big') applyBig(!document.body.classList.contains('big'));
      else if(a==='restart'){ close(); restart(false); return; }
      else if(a==='close'){ close(); return; }
      else if(a==='copy'){
        const u=location.origin.startsWith('http')
          ? location.origin+location.pathname+'?seed='+encodeURIComponent(SEED)
          : location.href.split('?')[0]+'?seed='+encodeURIComponent(SEED);
        copy(u); b.querySelector('.s').textContent='已複製'; return;
      }
      else applyTheme(a);
      if(S) board(0);
      if(S&&S.over) drawChart();
    };
  });
}

function start(){
  const sv=$('seed-show').value.trim();
  if(sv) SEED=sv;
  /* file:// 與 sandbox iframe 下帶 query 的 replaceState 會拋 SecurityError，
     種子照樣有效，只是網址列不反映——不該因此整局崩掉 */
  try{ history.replaceState(null,'','?seed='+encodeURIComponent(SEED)); }catch(e){}
  seedInit(SEED);

  S=newState();
  S.name=clean($('in-name').value.trim(),8)||'無名氏';
  S.org=ORGPICK;
  S.fast=FASTPICK;

  /* 初始能力：隨機底子 + 動機加成 */
  ABK.forEach(k=>{ S.ab[k]=ri(6,16); });
  const o=ORG[S.org];
  for(const k in o.ab) S.ab[k]+=o.ab[k];
  addMood(o.mood); addLife(o.life);

  /* 壓歲錢 */
  S.nav=ri(3,9);
  S.prevNav=S.nav; S.peak=S.nav; S.navHist=[S.nav];

  /* 行情：整條 25 年一次生成（種子的核心承諾）*/
  S.market=genMarket(TOTAL);
  S.peers=genPeers();    /* 必須緊接在 genMarket 之後，順序固定才能復現 */
  S.tsmRet=genBench();
  S.bIdx=S.nav; S.bTsm=S.nav; S.bIdxH=[S.nav]; S.bTsmH=[S.nav];
  S.ghost=CHALLENGE||loadGhost();   /* 戰帖優先；否則用同種子的上一次。都會畫成灰線 */

  $('start').style.display='none';
  $('game').classList.add('on');
  track('start-'+ORGPICK+(S.fast?'-fast':'-full'),'開局');
  $('ver').style.display='none';

  card('info','開戶',
    '「未成年要監護人同意書。」櫃檯小姐說。你早就準備好了。<br>'+
    '你把紅包裡的 <b class="hl">'+fmtM(S.nav)+'</b> 存了進去。'+
    '手機裝上看盤軟體的那個晚上，你幾乎沒睡。','START');
  card('info','你為什麼來', o.d + '<div class="tbl">起始能力　'+
    ABK.map(k=>ABL[k]+' '+S.ab[k]).join('　')+'</div>');
  card('info','同期',
    '同一年開戶的還有 <b class="hl">'+S.peers.map(p=>p.name).join('</b>、<b class="hl">')+'</b>。'+
    '你們會走過同樣的二十四年行情。'+
    '<br><span style="color:var(--dim)">每隔幾年你會知道他們走到哪了。到了四十歲，會有一張總表。</span>','PEERS');
  if(S.ghost){
    const g=S.ghost;
    card('gold', g.vs?'有人向你下戰帖':'這顆種子你走過',
      (g.vs?'<b class="hl">'+esc(g.name)+'</b>':'上次是 <b class="hl">'+esc(g.name)+'</b>')+
      (g.school?'（'+SCHOOL[g.school].n+'）':'')+
      ' 在這顆種子上走到 <b class="hl">'+fmtM(g.nav)+'</b>——「'+g.title+'」。<br>'+
      '同樣的二十四年牛熊、同樣幾次崩盤。'+
      (g.vs?'他的淨值曲線會用灰線跟著你跑。':'這次換你怎麼走。')+'','GHOST');
  }
  board(1);
  if(S.fast){ askPlan(); return; }
  choose('',[{t:'▸ 開始',main:true,s:'種子 '+SEED+'｜這條路上會有幾次崩盤，你還不知道',f:nextYear}]);
}

boot();
</script>
